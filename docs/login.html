<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Financeiro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f1f5f9;--surface:#fff;--surface2:#f8fafc;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.06);--radius-sm:10px;--transition:.22s cubic-bezier(.4,0,.2,1)}
    [data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--surface2:#273549;--border:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b}
    body{font-family:'Poppins',sans-serif!important;background:var(--bg)!important;color:var(--text)!important}
    [data-theme="dark"] .card{background:var(--surface)!important;border-color:var(--border)!important;color:var(--text)!important}
    [data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--surface2)!important;color:var(--text)!important;border-color:var(--border)!important}
    [data-theme="dark"] label,[data-theme="dark"] h1,[data-theme="dark"] h2,[data-theme="dark"] h3{color:var(--text)!important}
    [data-theme="dark"] .stat-card{background:var(--surface2)!important}[data-theme="dark"] .stat-title{color:var(--text2)!important}
    [data-theme="dark"] .auth-card{background:var(--surface)!important;color:var(--text)!important}
    .sf-header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between}
    .sf-brand{font-weight:700;font-size:1.15rem;color:var(--text);display:flex;align-items:center;gap:.5rem;text-decoration:none}
    .sf-brand span{color:#22c55e}
    .sf-hr{display:flex;align-items:center;gap:.75rem}
    .sf-theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.35rem .75rem;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition);font-family:inherit}
    .sf-theme-btn:hover{background:var(--border)}
    .sf-nav{position:sticky;top:60px;z-index:99;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:.1rem;height:42px;overflow-x:auto}
    .sf-nav::-webkit-scrollbar{height:0}
    .sf-nav a{display:inline-flex;align-items:center;gap:.3rem;padding:.28rem .65rem;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;color:var(--text2);text-decoration:none;white-space:nowrap;transition:all var(--transition);flex-shrink:0}
    .sf-nav a:hover{background:var(--surface2);color:var(--text)}
    .sf-nav a.active{background:#f0fdf4;color:#16a34a}
    [data-theme="dark"] .sf-nav a.active{background:rgba(34,197,94,.15);color:#4ade80}
    .sf-footer{text-align:center;padding:1.5rem;font-size:.72rem;color:var(--text3);border-top:1px solid var(--border);margin-top:1rem}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="sf-header">
    <a href="index.html" class="sf-brand">💰 <span>Sistema</span> Financeiro</a>
    <div class="sf-hr">
      <button class="sf-theme-btn" onclick="sfToggleTheme()" id="sfThemeBtn">🌙 Escuro</button>
    </div>
  </header>
  <nav class="sf-nav">
    <a href="index.html">🏠 Portal</a>
    <a href="register.html">📝 Criar Conta</a>
    <a href="login.html" class="active">🔐 Login</a>
  </nav>

  <div class="auth-container">
    <div class="card auth-card">
      <div class="card-header text-center">
        <h1 class="card-title">💰 Sistema Financeiro</h1>
        <p class="card-description">Entre com suas credenciais para acessar</p>
      </div>

      <div id="debugInfo" class="alert alert-info hidden"></div>
      <div id="errorMessage" class="alert alert-error hidden"></div>
      <div id="successMessage" class="alert alert-success hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="seu@email.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">
          <span id="btnText">Entrar</span>
          <span id="btnLoading" class="loading hidden"></span>
        </button>
      </form>

      <div class="text-center mt-2">
        <p style="font-size: 0.875rem; color: var(--gray-600);">
          Não tem uma conta? 
          <a href="register.html" style="color: var(--primary); font-weight: 500;">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // ── Supabase inline config ──────────────────────────────────────
    const SUPABASE_URL = 'https://yjaalhjqbiyguktsfqtq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqYWFsaGpxYml5Z3VrdHNmcXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1MDcyOTUsImV4cCI6MjA3OTA4MzI5NX0.7QFF_yAHrDZga140y3IbKwqS_hJeImahZsvuKBes5vg';
    let supabaseClient = null;
    function createSupabaseClient() {
      if (!supabaseClient) supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return supabaseClient;
    }
    async function checkAuth() {
      const { data: { session } } = await createSupabaseClient().auth.getSession();
      return session;
    }
    async function login(email, password) {
      const { data, error } = await createSupabaseClient().auth.signInWithPassword({ email, password });
      if (error) throw error;
      return data;
    }
  </script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const debugInfo = document.getElementById('debugInfo');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    // Verificar se já está logado
    window.addEventListener('DOMContentLoaded', async () => {
      const session = await checkAuth();
      if (session) {
        window.location.href = 'index.html';
      }
    });

    // Função para mostrar mensagem
    function showMessage(element, message) {
      element.textContent = message;
      element.classList.remove('hidden');
    }

    function hideMessages() {
      debugInfo.classList.add('hidden');
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');
    }

    // Handler do formulário
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      hideMessages();
      submitBtn.disabled = true;
      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      showMessage(debugInfo, '🔍 Iniciando login...');

      try {
        showMessage(debugInfo, '🔍 Chamando Supabase...');
        
        const data = await login(email, password);
        
        if (data.session) {
          showMessage(successMessage, '✅ Login realizado com sucesso! Redirecionando...');
          debugInfo.classList.add('hidden');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      } catch (error) {
        console.error('Erro no login:', error);
        hideMessages();
        showMessage(errorMessage, error.message || 'Credenciais inválidas. Verifique seu email e senha.');
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    });
  </script>
  <footer class="sf-footer">Sistema Financeiro © 2026 — Carlos Caxito &nbsp;|  Dados demonstrativos</footer>
  <script>function sfToggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('sfThemeBtn').textContent=d?'🌙 Escuro':'☀️ Claro'}</script>
</body>
</html>
