<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Financeiro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="navbar-brand">💰 Sistema Financeiro</a>
      <div class="navbar-menu">
        <a href="index.html" class="navbar-link">🏠 Portal</a>
        <a href="register.html" class="navbar-link">Criar Conta</a>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="card auth-card">
      <div class="card-header text-center">
        <h1 class="card-title">💰 Sistema Financeiro</h1>
        <p class="card-description">Entre com suas credenciais para acessar</p>
      </div>

      <div id="debugInfo" class="alert alert-info hidden"></div>
      <div id="errorMessage" class="alert alert-error hidden"></div>
      <div id="successMessage" class="alert alert-success hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="seu@email.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">
          <span id="btnText">Entrar</span>
          <span id="btnLoading" class="loading hidden"></span>
        </button>
      </form>

      <div class="text-center mt-2">
        <p style="font-size: 0.875rem; color: var(--gray-600);">
          Não tem uma conta? 
          <a href="register.html" style="color: var(--primary); font-weight: 500;">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // ── Supabase inline config ──────────────────────────────────────
    const SUPABASE_URL = 'https://yjaalhjqbiyguktsfqtq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqYWFsaGpxYml5Z3VrdHNmcXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1MDcyOTUsImV4cCI6MjA3OTA4MzI5NX0.7QFF_yAHrDZga140y3IbKwqS_hJeImahZsvuKBes5vg';
    let supabaseClient = null;
    function createSupabaseClient() {
      if (!supabaseClient) supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return supabaseClient;
    }
    async function checkAuth() {
      const { data: { session } } = await createSupabaseClient().auth.getSession();
      return session;
    }
    async function login(email, password) {
      const { data, error } = await createSupabaseClient().auth.signInWithPassword({ email, password });
      if (error) throw error;
      return data;
    }
  </script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const debugInfo = document.getElementById('debugInfo');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    // Verificar se já está logado
    window.addEventListener('DOMContentLoaded', async () => {
      const session = await checkAuth();
      if (session) {
        window.location.href = 'index.html';
      }
    });

    // Função para mostrar mensagem
    function showMessage(element, message) {
      element.textContent = message;
      element.classList.remove('hidden');
    }

    function hideMessages() {
      debugInfo.classList.add('hidden');
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');
    }

    // Handler do formulário
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      hideMessages();
      submitBtn.disabled = true;
      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      showMessage(debugInfo, '🔍 Iniciando login...');

      try {
        showMessage(debugInfo, '🔍 Chamando Supabase...');
        
        const data = await login(email, password);
        
        if (data.session) {
          showMessage(successMessage, '✅ Login realizado com sucesso! Redirecionando...');
          debugInfo.classList.add('hidden');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      } catch (error) {
        console.error('Erro no login:', error);
        hideMessages();
        showMessage(errorMessage, error.message || 'Credenciais inválidas. Verifique seu email e senha.');
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
