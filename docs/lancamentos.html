<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Lançamento - Sistema Financeiro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f1f5f9;--surface:#fff;--surface2:#f8fafc;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.06);--radius-sm:10px;--transition:.22s cubic-bezier(.4,0,.2,1)}
    [data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--surface2:#273549;--border:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b}
    body{font-family:'Poppins',sans-serif!important;background:var(--bg)!important;color:var(--text)!important}
    [data-theme="dark"] .card{background:var(--surface)!important;border-color:var(--border)!important;color:var(--text)!important}
    [data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--surface2)!important;color:var(--text)!important;border-color:var(--border)!important}
    [data-theme="dark"] label,[data-theme="dark"] h1,[data-theme="dark"] h2,[data-theme="dark"] h3{color:var(--text)!important}
    [data-theme="dark"] .stat-card{background:var(--surface2)!important}[data-theme="dark"] .stat-title{color:var(--text2)!important}
    [data-theme="dark"] .auth-card{background:var(--surface)!important;color:var(--text)!important}
    .sf-header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between}
    .sf-brand{font-weight:700;font-size:1.15rem;color:var(--text);display:flex;align-items:center;gap:.5rem;text-decoration:none}
    .sf-brand span{color:#22c55e}
    .sf-hr{display:flex;align-items:center;gap:.75rem}
    .sf-theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.35rem .75rem;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition);font-family:inherit}
    .sf-theme-btn:hover{background:var(--border)}
    .sf-nav{position:sticky;top:60px;z-index:99;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:.1rem;height:42px;overflow-x:auto}
    .sf-nav::-webkit-scrollbar{height:0}
    .sf-nav a{display:inline-flex;align-items:center;gap:.3rem;padding:.28rem .65rem;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;color:var(--text2);text-decoration:none;white-space:nowrap;transition:all var(--transition);flex-shrink:0}
    .sf-nav a:hover{background:var(--surface2);color:var(--text)}
    .sf-nav a.active{background:#f0fdf4;color:#16a34a}
    [data-theme="dark"] .sf-nav a.active{background:rgba(34,197,94,.15);color:#4ade80}
    .sf-footer{text-align:center;padding:1.5rem;font-size:.72rem;color:var(--text3);border-top:1px solid var(--border);margin-top:1rem}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="sf-header">
    <a href="dashboard.html" class="sf-brand">💰 <span>Sistema</span> Financeiro</a>
    <div class="sf-hr">
      <button class="sf-theme-btn" onclick="sfToggleTheme()" id="sfThemeBtn">🌙 Escuro</button>
    </div>
  </header>
  <nav class="sf-nav">
    <a href="index.html">🏠 Portal</a>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="lancamentos.html" class="active">➕ Novo Lançamento</a>
    <a href="lista-lancamentos.html">📋 Lista</a>
    <a href="relatorios.html">📈 Relatórios</a>
    <a href="cartao-credito.html">💳 Cartões</a>
    <a href="configuracoes.html">⚙️ Configurações</a>
    <a href="login.html">🔐 Login</a>
  </nav>

  <div class="container">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 1.5rem;">💰 Novo Lançamento</h1>

      <div id="errorMessage" class="alert alert-error hidden"></div>
      <div id="successMessage" class="alert alert-success hidden"></div>

      <form id="lancamentoForm">
        <!-- Tipo -->
        <div class="form-group">
          <label>Tipo</label>
          <div style="display: flex; gap: 1rem;">
            <button 
              type="button" 
              id="btnDespesa" 
              onclick="setTipo('DESPESA')"
              class="btn btn-danger"
              style="flex: 1; padding: 0.75rem;"
            >
              📉 Despesa
            </button>
            <button 
              type="button" 
              id="btnReceita" 
              onclick="setTipo('RECEITA')"
              class="btn btn-secondary"
              style="flex: 1; padding: 0.75rem;"
            >
              📈 Receita
            </button>
          </div>
        </div>

        <!-- Descrição -->
        <div class="form-group">
          <label for="descricao">Descrição *</label>
          <input 
            type="text" 
            id="descricao" 
            name="descricao" 
            placeholder="Ex: Compra no supermercado"
            required
          >
        </div>

        <!-- Valor e Data -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="valor">Valor *</label>
            <input 
              type="number" 
              id="valor" 
              name="valor" 
              placeholder="0.00"
              step="0.01"
              min="0"
              required
            >
          </div>

          <div class="form-group">
            <label for="data">Data *</label>
            <input 
              type="date" 
              id="data" 
              name="data" 
              required
            >
          </div>
        </div>

        <!-- Grupo -->
        <div class="form-group">
          <label for="grupo">Grupo *</label>
          <select id="grupo" name="grupo" required>
            <option value="">Selecione um grupo</option>
          </select>
        </div>

        <!-- Subgrupo -->
        <div class="form-group">
          <label for="subgrupo">Subgrupo *</label>
          <select id="subgrupo" name="subgrupo" required disabled>
            <option value="">Selecione um subgrupo</option>
          </select>
        </div>

        <!-- Classe -->
        <div class="form-group">
          <label for="classe">Classe *</label>
          <select id="classe" name="classe" required disabled>
            <option value="">Selecione uma classe</option>
          </select>
        </div>

        <!-- Botões -->
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="button" onclick="window.location.href='dashboard.html'" class="btn btn-secondary" style="flex: 1;">
            ← Voltar
          </button>
          <button type="button" onclick="window.location.href='lista-lancamentos.html'" class="btn btn-secondary" style="flex: 1;">
            📋 Ver Lançamentos
          </button>
          <button type="button" onclick="window.location.href='cartao-credito.html'" class="btn" style="flex: 1; background: #7c3aed; color: white;">
            💳 Despesas com Cartão
          </button>
          <button type="submit" class="btn btn-success" style="flex: 1;" id="submitBtn">
            <span id="btnText">💾 Salvar</span>
            <span id="btnLoading" class="loading hidden"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="config/supabase-config.js"></script>
  <script>
    let tipoSelecionado = 'DESPESA';
    let grupos = [];
    let subgrupos = [];
    let classes = [];

    // Verificar autenticação
    window.addEventListener('DOMContentLoaded', async () => {
      await protectPage();
      
      // Definir data atual
      const hoje = new Date().toISOString().split('T')[0];
      document.getElementById('data').value = hoje;
      
      await carregarGrupos();
    });

    async function handleLogout() {
      try {
        await logout();
        window.location.href = 'login.html';
      } catch (error) {
        alert('Erro ao fazer logout: ' + error.message);
      }
    }

    function setTipo(tipo) {
      tipoSelecionado = tipo;
      
      const btnDespesa = document.getElementById('btnDespesa');
      const btnReceita = document.getElementById('btnReceita');

      if (tipo === 'DESPESA') {
        btnDespesa.className = 'btn btn-danger';
        btnReceita.className = 'btn btn-secondary';
      } else {
        btnDespesa.className = 'btn btn-secondary';
        btnReceita.className = 'btn btn-success';
      }

      // Limpar seleções
      document.getElementById('grupo').value = '';
      document.getElementById('subgrupo').value = '';
      document.getElementById('classe').value = '';
      
      carregarGrupos();
    }

    async function carregarGrupos() {
      try {
        const data = await fetchData('grupos', {
          eq: { ativo: true, tipo: tipoSelecionado },
          order: { column: 'codigo', ascending: true }
        });

        grupos = data || [];
        const selectGrupo = document.getElementById('grupo');
        selectGrupo.innerHTML = '<option value="">Selecione um grupo</option>';
        
        grupos.forEach(grupo => {
          const option = document.createElement('option');
          option.value = grupo.id;
          option.textContent = `${grupo.codigo} - ${grupo.nome}`;
          selectGrupo.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar grupos:', error);
        showError('Erro ao carregar grupos');
      }
    }

    async function carregarSubgrupos(grupoId) {
      const selectSubgrupo = document.getElementById('subgrupo');
      const selectClasse = document.getElementById('classe');
      
      if (!grupoId) {
        selectSubgrupo.disabled = true;
        selectSubgrupo.innerHTML = '<option value="">Selecione um subgrupo</option>';
        selectClasse.disabled = true;
        selectClasse.innerHTML = '<option value="">Selecione uma classe</option>';
        return;
      }

      try {
        const data = await fetchData('subgrupos', {
          eq: { grupo_id: grupoId, ativo: true },
          order: { column: 'codigo', ascending: true }
        });

        subgrupos = data || [];
        selectSubgrupo.innerHTML = '<option value="">Selecione um subgrupo</option>';
        selectSubgrupo.disabled = false;
        
        subgrupos.forEach(subgrupo => {
          const option = document.createElement('option');
          option.value = subgrupo.id;
          option.textContent = `${subgrupo.codigo} - ${subgrupo.nome}`;
          selectSubgrupo.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar subgrupos:', error);
        showError('Erro ao carregar subgrupos');
      }
    }

    async function carregarClasses(subgrupoId) {
      const selectClasse = document.getElementById('classe');
      
      if (!subgrupoId) {
        selectClasse.disabled = true;
        selectClasse.innerHTML = '<option value="">Selecione uma classe</option>';
        return;
      }

      try {
        const data = await fetchData('classes', {
          eq: { subgrupo_id: subgrupoId, ativo: true },
          order: { column: 'codigo', ascending: true }
        });

        classes = data || [];
        selectClasse.innerHTML = '<option value="">Selecione uma classe</option>';
        selectClasse.disabled = false;
        
        classes.forEach(classe => {
          const option = document.createElement('option');
          option.value = classe.id;
          option.textContent = `${classe.codigo} - ${classe.descricao}`;
          selectClasse.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar classes:', error);
        showError('Erro ao carregar classes');
      }
    }

    // Event listeners
    document.getElementById('grupo').addEventListener('change', (e) => {
      carregarSubgrupos(e.target.value);
    });

    document.getElementById('subgrupo').addEventListener('change', (e) => {
      carregarClasses(e.target.value);
    });

    // Submit form
    document.getElementById('lancamentoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      hideMessages();
      
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnLoading = document.getElementById('btnLoading');
      
      submitBtn.disabled = true;
      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');

      const formData = {
        descricao_complementar: document.getElementById('descricao').value.trim(),
        valor: parseFloat(document.getElementById('valor').value),
        data: document.getElementById('data').value,
        tipo: tipoSelecionado,
        classe_id: parseInt(document.getElementById('classe').value)
      };

      try {
        const supabase = createSupabaseClient();
        const { data: session } = await supabase.auth.getSession();
        
        if (session.session) {
          formData.user_id = session.session.user.id;
        }

        await insertData('lancamentos', formData);
        
        showSuccess('✅ Lançamento criado com sucesso! Redirecionando...');
        
        setTimeout(() => {
          window.location.href = 'lista-lancamentos.html';
        }, 1500);
        
      } catch (error) {
        console.error('Erro ao criar lançamento:', error);
        showError('Erro ao criar lançamento: ' + error.message);
        
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    });

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.remove('hidden');
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.classList.remove('hidden');
    }

    function hideMessages() {
      document.getElementById('errorMessage').classList.add('hidden');
      document.getElementById('successMessage').classList.add('hidden');
    }
  </script>
  <footer class="sf-footer">Sistema Financeiro © 2026 — Carlos Caxito &nbsp;|  Dados demonstrativos</footer>
  <script>function sfToggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('sfThemeBtn').textContent=d?'🌙 Escuro':'☀️ Claro'}</script>
</body>
</html>
