  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // ════════════════════════════════════════════════════════════════
    // THEME HOOK — observa data-theme no <html> e força re-render
    // ════════════════════════════════════════════════════════════════
    function useTheme() {
      const [isDark, setIsDark] = useState(
        document.documentElement.getAttribute('data-theme') === 'dark'
      );
      useEffect(() => {
        const obs = new MutationObserver(() =>
          setIsDark(document.documentElement.getAttribute('data-theme') === 'dark')
        );
        obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        return () => obs.disconnect();
      }, []);
      return isDark;
    }

    // ════════════════════════════════════════════════════════════════
    // OFX PARSER
    // ════════════════════════════════════════════════════════════════

    function getTag(block, tag) {
      const re = new RegExp(`<${tag}[^>]*>\\s*([^<\\n\\r]+)`, "i");
      const m = block.match(re);
      return m ? m[1].trim() : "";
    }

    function parseOFXDate(raw) {
      if (!raw) return null;
      const s = raw.replace(/\[.*\]/, "").trim();
      const y = parseInt(s.substring(0, 4));
      const mo = parseInt(s.substring(4, 6)) - 1;
      const d = parseInt(s.substring(6, 8));
      if (isNaN(y) || isNaN(mo) || isNaN(d)) return null;
      return new Date(y, mo, d);
    }

    function detectInstallment(memo) {
      if (!memo) return null;
      const u = memo.toUpperCase();
      const p1 = u.match(/(?:PARC(?:ELA)?\s+)?(\d{1,2})[\/\-](\d{1,2})(?:\s|$|[^0-9\/])/);
      if (p1) {
        const c = parseInt(p1[1]), t = parseInt(p1[2]);
        if (c >= 1 && t >= 2 && c <= t && t <= 72) return { current: c, total: t };
      }
      const p2 = u.match(/(\d{1,2})\s+DE\s+(\d{1,2})/);
      if (p2) {
        const c = parseInt(p2[1]), t = parseInt(p2[2]);
        if (c >= 1 && t >= 2 && c <= t && t <= 72) return { current: c, total: t };
      }
      return null;
    }

    function cleanMemo(memo) {
      return memo
        .replace(/\s*(?:PARC(?:ELA)?\s+)?\d{1,2}[\/\-]\d{1,2}/gi, "")
        .replace(/\s*\d{1,2}\s+DE\s+\d{1,2}/gi, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function parseOFX(text) {
      const content = text.replace(/\r/g, "\n");
      const transactions = [];
      const xmlRe = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
      let match;
      while ((match = xmlRe.exec(content)) !== null) {
        const t = parseTrnBlock(match[1]);
        if (t) transactions.push(t);
      }
      if (transactions.length === 0) {
        const parts = content.split(/<STMTTRN>/i).slice(1);
        for (const part of parts) {
          const endRe = /<\/?(?:STMTTRN|BANKTRANLIST|CCSTMTRS|STMTRS|LEDGERBAL|AVAILBAL)/i;
          const endIdx = part.search(endRe);
          const block = endIdx > -1 ? part.substring(0, endIdx) : part;
          const t = parseTrnBlock(block);
          if (t) transactions.push(t);
        }
      }
      const acctId = getTag(content, "ACCTID") || getTag(content, "ACCTNUM") || "";
      const bankId = getTag(content, "BANKID") || getTag(content, "ORG") || "";
      const dtStart = parseOFXDate(getTag(content, "DTSTART"));
      const dtEnd = parseOFXDate(getTag(content, "DTEND"));
      const ledgerBal = parseFloat(getTag(content, "BALAMT")) || null;
      return {
        transactions: transactions.filter(t => t !== null),
        meta: { acctId, bankId, dtStart, dtEnd, ledgerBal },
      };
    }

    function parseTrnBlock(block) {
      const amountStr = getTag(block, "TRNAMT");
      const amount = parseFloat(amountStr.replace(",", "."));
      if (isNaN(amount) || amount === 0) return null;
      const memo = getTag(block, "MEMO") || getTag(block, "NAME") || "";
      const fitid = getTag(block, "FITID");
      const dtPosted = parseOFXDate(getTag(block, "DTPOSTED"));
      const trntype = getTag(block, "TRNTYPE").toUpperCase();
      const installment = detectInstallment(memo);
      const cleanDesc = cleanMemo(memo) || memo;
      return {
        fitid,
        amount: Math.abs(amount),
        isCredit: trntype === "CREDIT" || amount > 0,
        memo,
        cleanDesc,
        installment,
        date: dtPosted,
        trntype,
      };
    }

    // ════════════════════════════════════════════════════════════════
    // UTILS
    // ════════════════════════════════════════════════════════════════
    function detectBrand(num) {
      const n = num.replace(/\D/g, "");
      if (!n) return null;
      if (/^4/.test(n)) return "Visa";
      if (/^(5[1-5]|2[2-7])/.test(n)) return "Mastercard";
      if (/^3[47]/.test(n)) return "Amex";
      if (/^(636368|4011|4312|4389|4514|4576|5041|5066|5067|509|6277|6362|6363|650[04]|6516|6550)/.test(n)) return "Elo";
      if (/^606282/.test(n)) return "Hipercard";
      if (/^(38|60)/.test(n)) return "Diners";
      return null;
    }

    function luhn(num) {
      const n = num.replace(/\D/g, "");
      if (n.length < 13) return null;
      let sum = 0;
      for (let i = 0; i < n.length; i++) {
        let d = parseInt(n[n.length - 1 - i]);
        if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
        sum += d;
      }
      return sum % 10 === 0;
    }

    function maskCard(val) {
      return val.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
    }

    const fmt = (v) => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const parseMoney = (v) => parseFloat((v || "").replace(",", ".")) || 0;

    function addMonths(base, n) {
      const d = new Date(base);
      d.setMonth(d.getMonth() + n);
      return d;
    }

    function fmtDate(d) {
      if (!d) return "—";
      return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
    }

    function fmtDateShort(d) {
      if (!d) return "—";
      return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    }

    const ACCENT = {
      Visa: "#1A6CFF", Mastercard: "#F79E1B", Amex: "#0099DD",
      Elo: "#C68800", Hipercard: "#ff4d4d", Diners: "#4B87CC",
      default: "#00e5a0",
    };
    const getAccent = (brand) => ACCENT[brand] || ACCENT.default;

    // ════════════════════════════════════════════════════════════════
    // CATEGORY PICKER — Hierarquia Grupo › Subgrupo › Classe
    // ════════════════════════════════════════════════════════════════
    function CategoryPicker({ value, onChange }) {
      const isDark = useTheme();
      const S = getS(isDark);
      const surface = isDark ? "#1e293b" : "#ffffff";
      const surf2   = isDark ? "#273549" : "#f8fafc";
      const border  = isDark ? "#334155" : "#e2e8f0";
      const text    = isDark ? "#f1f5f9" : "#1e293b";
      const text2   = isDark ? "#94a3b8" : "#64748b";

      const [open, setOpen]       = useState(false);
      const [level, setLevel]     = useState("grupos");
      const [grupos, setGrupos]   = useState([]);
      const [subgrupos, setSubs]  = useState([]);
      const [classes, setClasses] = useState([]);
      const [selG, setSelG]       = useState(null);
      const [selS, setSelS]       = useState(null);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (open && grupos.length === 0) {
          setLoading(true);
          fetchData("grupos", { eq: { ativo: true, tipo: "DESPESA" }, order: { column: "codigo", ascending: true } })
            .then(d => { setGrupos(d || []); setLoading(false); })
            .catch(() => setLoading(false));
        }
      }, [open]);

      function pickGrupo(g) {
        setSelG(g); setSelS(null); setLoading(true);
        fetchData("subgrupos", { eq: { grupo_id: g.id, ativo: true }, order: { column: "codigo", ascending: true } })
          .then(d => { setSubs(d || []); setLevel("subgrupos"); setLoading(false); })
          .catch(() => setLoading(false));
      }

      function pickSub(sg) {
        setSelS(sg); setLoading(true);
        fetchData("classes", { eq: { subgrupo_id: sg.id, ativo: true }, order: { column: "codigo", ascending: true } })
          .then(d => { setClasses(d || []); setLevel("classes"); setLoading(false); })
          .catch(() => setLoading(false));
      }

      function pickClasse(cl) {
        onChange({ grupoId: selG.id, subgrupoId: selS.id, classeId: cl.id,
          label: `${selG.nome} › ${selS.nome} › ${cl.descricao || cl.codigo}` });
        setOpen(false); setLevel("grupos"); setSelG(null); setSelS(null);
      }

      const dropStyle = {
        position: "absolute", top: "110%", left: 0, zIndex: 300,
        background: surface, border: `1px solid ${border}`, borderRadius: 10,
        padding: 12, minWidth: 250, maxWidth: 320,
        boxShadow: "0 8px 32px rgba(0,0,0,.25)", maxHeight: 280, overflowY: "auto",
      };
      const rowStyle = { cursor: "pointer", padding: "7px 10px", borderRadius: 6, fontSize: 13, color: text };

      return (
        <div style={{ position: "relative", display: "inline-block" }}>
          <button type="button"
            style={{ ...S.btnSecondary, fontSize: 12, padding: "6px 10px",
              color: value ? "#3b82f6" : text2, borderColor: value ? "#3b82f655" : border }}
            onClick={() => setOpen(p => !p)}>
            🏷️ {value ? "Mudar categoria" : "Categoria"}
          </button>
          {open && (
            <div style={dropStyle}>
              <div style={{ display: "flex", gap: 4, fontSize: 11, marginBottom: 8, color: text2, flexWrap: "wrap", alignItems: "center" }}>
                <span style={{ cursor: "pointer", color: "#3b82f6" }}
                  onClick={() => { setLevel("grupos"); setSelG(null); setSelS(null); }}>Grupos</span>
                {selG && <><span>›</span>
                  <span style={{ cursor: selS ? "pointer" : "default", color: selS ? "#3b82f6" : text }}
                    onClick={() => { if (selS) { setLevel("subgrupos"); setSelS(null); } }}>{selG.nome}</span></>}
                {selS && <><span>›</span><span style={{ color: text }}>{selS.nome}</span></>}
              </div>
              {loading && <div style={{ color: text2, fontSize: 12, padding: "8px 0" }}>⏳ Carregando...</div>}
              {!loading && level === "grupos" && (grupos.length === 0
                ? <div style={{ color: text2, fontSize: 12 }}>Nenhum grupo de despesa ativo.</div>
                : grupos.map(g => <div key={g.id} style={rowStyle} onClick={() => pickGrupo(g)}>{g.codigo} – {g.nome}</div>)
              )}
              {!loading && level === "subgrupos" && subgrupos.map(sg =>
                <div key={sg.id} style={rowStyle} onClick={() => pickSub(sg)}>{sg.codigo} – {sg.nome}</div>
              )}
              {!loading && level === "classes" && classes.map(cl =>
                <div key={cl.id} style={rowStyle} onClick={() => pickClasse(cl)}>{cl.codigo} – {cl.descricao}</div>
              )}
              <div style={{ marginTop: 8, borderTop: `1px solid ${border}`, paddingTop: 8, display: "flex", justifyContent: "space-between" }}>
                {value && <button type="button" onClick={() => { onChange(null); setOpen(false); }}
                  style={{ fontSize: 11, color: "#ef4444", background: "none", border: "none", cursor: "pointer" }}>✕ Remover</button>}
                <button type="button" onClick={() => setOpen(false)}
                  style={{ fontSize: 11, color: text2, background: "none", border: "none", cursor: "pointer", marginLeft: "auto" }}>Fechar</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    // SUPABASE SAVE — Cartão entries → tabela lancamentos
    // ════════════════════════════════════════════════════════════════
    async function saveCartaoEntriesToSupabase(entries) {
      try {
        const supa = createSupabaseClient();
        const { data: sd } = await supa.auth.getSession();
        const userId = sd?.session?.user?.id || null;
        const records = entries.map(e => ({
          descricao_complementar: e.installment
            ? `${e.desc} [${e.cardAlias || "Cartão"} ${e.installment}]`
            : `${e.desc} [${e.cardAlias || "Cartão"}]`,
          valor: e.value,
          data: (e.dueDate || e.ofxDate)
            ? (e.dueDate || e.ofxDate).toISOString().split("T")[0]
            : new Date().toISOString().split("T")[0],
          tipo: "CARTAO",
          classe_id: e.classeId || null,
          user_id: userId,
        }));
        const { error } = await supa.from("lancamentos").insert(records);
        if (error) console.error("Erro Supabase cartão:", error.message);
      } catch (err) {
        console.error("Erro ao salvar lançamentos do cartão:", err);
      }
    }

    // ════════════════════════════════════════════════════════════════
    // OFX IMPORTER COMPONENT
    // ════════════════════════════════════════════════════════════════
    function OFXImporter({ cards, onImport, onClose, importedFitids }) {
      const isDark = useTheme();
      const S = getS(isDark);
      const [drag, setDrag] = useState(false);
      const [parsed, setParsed] = useState(null);
      const [selected, setSelected] = useState({});
      const [targetCardId, setTargetCardId] = useState(cards[0]?.id ?? "");
      const [error, setError] = useState("");
      const [category, setCategory] = useState(null);
      const fileRef = useRef();

      const targetCard = cards.find(c => c.id === parseInt(targetCardId) || c.id === targetCardId);
      const accent = getAccent(targetCard?.brand);

      const classified = useMemo(() => {
        if (!parsed) return {};
        const map = {};
        parsed.transactions.forEach(t => {
          if (importedFitids.has(t.fitid)) map[t.fitid] = "duplicate";
          else if (t.isCredit) map[t.fitid] = "credit";
          else map[t.fitid] = "new";
        });
        return map;
      }, [parsed, importedFitids]);

      const dupCount = Object.values(classified).filter(v => v === "duplicate").length;
      const allDups = parsed && dupCount === parsed.transactions.length;

      function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const result = parseOFX(e.target.result);
            if (result.transactions.length === 0) {
              setError("Nenhuma transação encontrada no arquivo. Verifique se é um OFX válido.");
              return;
            }
            setError("");
            setParsed(result);
            const sel = {};
            result.transactions.forEach(t => {
              sel[t.fitid] = !importedFitids.has(t.fitid) && !t.isCredit;
            });
            setSelected(sel);
          } catch (err) {
            setError("Erro ao ler o arquivo: " + err.message);
          }
        };
        reader.readAsText(file, "latin1");
      }

      function handleDrop(e) {
        e.preventDefault();
        setDrag(false);
        handleFile(e.dataTransfer.files[0]);
      }

      function toggleAll(val) {
        const sel = {};
        parsed.transactions.forEach(t => {
          sel[t.fitid] = val && classified[t.fitid] !== "duplicate";
        });
        setSelected(sel);
      }

      function doImport() {
        if (!targetCard) return;
        const toImport = parsed.transactions.filter(t => selected[t.fitid]);
        const newEntries = [];

        toImport.forEach((t, idx) => {
          const groupId = Date.now() + idx * 1000;
          const inst = t.installment;
          if (!inst) {
            newEntries.push({
              id: groupId, groupId, cardId: targetCard.id,
              desc: t.cleanDesc, value: t.amount, total: t.amount,
              installment: null, month: 0,
              dueDate: addMonths(targetCard.dueDate, 0),
              fromOFX: true, ofxDate: t.date, ofxFitid: t.fitid,
              classeId: category?.classeId || null, categoryLabel: category?.label || null, cardAlias: targetCard.alias,
            });
          } else {
            const remaining = inst.total - inst.current;
            newEntries.push({
              id: groupId, groupId, cardId: targetCard.id,
              desc: t.cleanDesc, value: t.amount, total: t.amount * inst.total,
              installment: `${inst.current}/${inst.total}`, month: 0,
              dueDate: addMonths(targetCard.dueDate, 0),
              fromOFX: true, ofxDate: t.date, ofxFitid: t.fitid,
              classeId: category?.classeId || null, categoryLabel: category?.label || null, cardAlias: targetCard.alias,
            });
            for (let r = 1; r <= remaining; r++) {
              newEntries.push({
                id: groupId + r, groupId, cardId: targetCard.id,
                desc: t.cleanDesc, value: t.amount, total: t.amount * inst.total,
                installment: `${inst.current + r}/${inst.total}`, month: r,
                dueDate: addMonths(targetCard.dueDate, r),
                fromOFX: true, ofxDate: t.date, ofxFitid: t.fitid,
                classeId: category?.classeId || null, categoryLabel: category?.label || null, cardAlias: targetCard.alias,
              });
            }
          }
        });

        const importedIds = toImport.map(t => t.fitid);
        onImport(newEntries, importedIds);
        onClose();
      }

      const selectedCount = Object.values(selected).filter(Boolean).length;
      const totalSelected = parsed?.transactions
        .filter(t => selected[t.fitid])
        .reduce((s, t) => s + t.amount, 0) || 0;

      return (
        <div style={S.importerCard}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <h2 style={S.sectionTitle}>
              <span style={{ color: accent }}>⬆</span> Importar OFX
            </h2>
            <button style={S.btnRemove} onClick={onClose}>✕ Fechar</button>
          </div>

          <div style={S.field}>
            <label style={S.label}>Cartão de destino</label>
            <select style={{ ...S.input, borderColor: accent + "66" }}
              value={targetCardId}
              onChange={e => setTargetCardId(e.target.value)}>
              {cards.map(c => <option key={c.id} value={c.id}>{c.alias}{c.brand ? ` · ${c.brand}` : ""}</option>)}
            </select>
          </div>

          {!parsed && (
            <div
              style={{
                ...S.dropZone,
                borderColor: drag ? accent : (isDark ? "#1e2840" : "#cbd5e1"),
                background: drag ? accent + "11" : (isDark ? "#0a0d18" : "#f8fafc"),
              }}
              onDragOver={e => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={handleDrop}
              onClick={() => fileRef.current?.click()}
            >
              <input ref={fileRef} type="file" accept=".ofx,.OFX" style={{ display: "none" }}
                onChange={e => handleFile(e.target.files[0])} />
              <div style={{ fontSize: 32, marginBottom: 8 }}>📂</div>
              <div style={{ color: isDark ? "#f1f5f9" : "#1e293b", fontSize: 13, fontWeight: 600 }}>
                Arraste o arquivo .OFX aqui
              </div>
              <div style={{ color: isDark ? "#94a3b8" : "#64748b", fontSize: 11, marginTop: 4 }}>
                ou clique para selecionar
              </div>
              <div style={{ color: isDark ? "#64748b" : "#94a3b8", fontSize: 10, marginTop: 8 }}>
                Compatível com Nubank, Itaú, Bradesco, Santander, BB, Caixa, C6, Inter e outros
              </div>
            </div>
          )}

          {error && <div style={S.errorBox}>{error}</div>}

          {parsed && (
            <>
              <div style={S.metaBox}>
                {parsed.meta.bankId && <span style={S.metaChip}>🏦 {parsed.meta.bankId}</span>}
                {parsed.meta.acctId && <span style={S.metaChip}>💳 ****{parsed.meta.acctId.slice(-4)}</span>}
                {parsed.meta.dtStart && <span style={S.metaChip}>📅 {fmtDate(parsed.meta.dtStart)} → {fmtDate(parsed.meta.dtEnd)}</span>}
                {parsed.meta.ledgerBal != null && <span style={S.metaChip}>💰 Saldo OFX: {fmt(Math.abs(parsed.meta.ledgerBal))}</span>}
                <span style={{ ...S.metaChip, color: accent }}>
                  {parsed.transactions.length} transação(ões) encontrada(s)
                </span>
              </div>

              {dupCount > 0 && (
                <div style={{
                  background: isDark ? "#1a1200" : "#fffbeb", border: isDark ? "1px solid #f5a62344" : "1px solid #fde68a",
                  borderRadius: 8, padding: "10px 14px",
                  display: "flex", alignItems: "center", gap: 8,
                }}>
                  <span style={{ fontSize: 16 }}>⚠️</span>
                  <div>
                    <div style={{ color: "#f5a623", fontSize: 12, fontWeight: 700 }}>
                      {allDups
                        ? "Este arquivo já foi importado anteriormente!"
                        : `${dupCount} transação(ões) já importada(s) anteriormente`}
                    </div>
                    <div style={{ color: "#7a6030", fontSize: 11, marginTop: 2 }}>
                      {allDups
                        ? "Todas as transações deste extrato já constam no sistema. Nada novo a importar."
                        : "As linhas em laranja foram bloqueadas automaticamente para evitar duplicidade."}
                    </div>
                  </div>
                </div>
              )}

              <div style={{
                display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap",
                background: isDark ? "#1a2744" : "#f0f9ff",
                border: `1px solid ${isDark ? "#2d4a7a" : "#bae6fd"}`,
                borderRadius: 8, padding: "10px 14px",
              }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: isDark ? "#7dd3fc" : "#0284c7" }}>🏷️ Categoria:</span>
                <CategoryPicker value={category} onChange={setCategory} />
                {category
                  ? <span style={{ fontSize: 12, color: "#3b82f6", fontWeight: 500 }}>{category.label}</span>
                  : <span style={{ fontSize: 12, color: isDark ? "#475569" : "#94a3b8" }}>Nenhuma — será aplicada a todas as transações selecionadas</span>
                }
              </div>

              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <button style={{ ...S.btnSecondary, fontSize: 10 }} onClick={() => toggleAll(true)}>Selecionar tudo</button>
                <button style={{ ...S.btnSecondary, fontSize: 10 }} onClick={() => toggleAll(false)}>Desmarcar tudo</button>
                <button style={{ ...S.btnSecondary, fontSize: 10 }} onClick={() => { setParsed(null); setError(""); }}>
                  Trocar arquivo
                </button>
                <span style={{ marginLeft: "auto", color: isDark ? "#64748b" : "#94a3b8", fontSize: 11 }}>
                  {selectedCount} selecionado(s) · {fmt(totalSelected)}
                </span>
              </div>

              <div style={{ overflowX: "auto" }}>
                <table style={S.table}>
                  <thead>
                    <tr>
                      <th style={S.th}></th>
                      <th style={S.th}>Data</th>
                      <th style={S.th}>Descrição</th>
                      <th style={S.th}>Parcela</th>
                      <th style={S.th}>Categoria</th>
                      <th style={S.th}>Tipo</th>
                      <th style={{ ...S.th, textAlign: "right" }}>Valor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {parsed.transactions.map(t => {
                      const status = classified[t.fitid];
                      const isDup = status === "duplicate";
                      const isSelected = !!selected[t.fitid];
                      return (
                        <tr key={t.fitid} style={{
                          ...S.tr,
                          opacity: isDup ? 1 : isSelected ? 1 : 0.35,
                          cursor: isDup ? "not-allowed" : "pointer",
                          background: isDup ? (isDark ? "#1a1000" : "#fff7ed") : "transparent",
                        }}
                          onClick={() => {
                            if (isDup) return;
                            setSelected(p => ({ ...p, [t.fitid]: !p[t.fitid] }));
                          }}>
                          <td style={S.td}>
                            {isDup ? (
                              <span title="Já importado — duplicata bloqueada"
                                style={{ color: "#f5a623", fontSize: 13 }}>⊘</span>
                            ) : (
                              <div style={{
                                width: 14, height: 14, borderRadius: 3,
                                border: `1.5px solid ${isSelected ? accent : (isDark ? "#334155" : "#e2e8f0")}`,
                                background: isSelected ? accent : "transparent",
                                display: "flex", alignItems: "center", justifyContent: "center",
                              }}>
                                {isSelected && <span style={{ color: "#000", fontSize: 9, fontWeight: 900 }}>✓</span>}
                              </div>
                            )}
                          </td>
                          <td style={{ ...S.td, whiteSpace: "nowrap" }}>{fmtDateShort(t.date)}</td>
                          <td style={{ ...S.td, maxWidth: 200 }}>
                            <div style={{ color: isDup ? "#92400e" : (isDark ? "#e2e8f0" : "#1e293b"), fontSize: 13, fontWeight: 500 }}>{t.cleanDesc}</div>
                            {t.cleanDesc !== t.memo && (
                              <div style={{ color: isDark ? "#64748b" : "#94a3b8", fontSize: 10, marginTop: 1 }}>{t.memo}</div>
                            )}
                            {isDup && (
                              <div style={{ color: "#f5a62388", fontSize: 10, marginTop: 1 }}>já importado</div>
                            )}
                          </td>
                          <td style={S.td}>
                            {t.installment ? (
                              <span style={{ ...S.instBadge, background: isDup ? (isDark ? "#1a1000" : "#fff7ed") : accent + "22", color: isDup ? "#92400e" : accent }}>
                                {t.installment.current}/{t.installment.total}
                                {!isDup && <span style={{ color: isDark ? "#64748b" : "#94a3b8", marginLeft: 3, fontSize: 9 }}>
                                  +{t.installment.total - t.installment.current} futuras
                                </span>}
                              </span>
                            ) : (
                              <span style={{ color: isDark ? "#64748b" : "#94a3b8", fontSize: 10 }}>à vista</span>
                            )}
                          </td>
                          <td style={S.td}>
                            {category
                              ? <span style={{ fontSize: 11, background: isDark ? "#1e3a5f" : "#dbeafe", color: "#3b82f6", borderRadius: 4, padding: "2px 7px", whiteSpace: "nowrap" }}>
                                  {category.label.split(" › ").pop()}
                                </span>
                              : <span style={{ color: isDark ? "#475569" : "#cbd5e1", fontSize: 11 }}>—</span>
                            }
                          </td>
                          <td style={S.td}>
                            <span style={{
                              fontSize: 10, borderRadius: 3, padding: "1px 5px",
                              background: t.isCredit ? (isDark ? "#1a3a1a" : "#dcfce7") : (isDark ? "#2a1a1a" : "#fee2e2"),
                              color: t.isCredit ? (isDark ? "#00cc66" : "#16a34a") : (isDark ? "#ff6b6b" : "#ef4444"),
                            }}>
                              {t.isCredit ? "CRÉD" : "DÉB"}
                            </span>
                          </td>
                          <td style={{ ...S.td, textAlign: "right", fontWeight: 600, color: isDup ? "#92400e" : t.isCredit ? (isDark ? "#00cc66" : "#16a34a") : "#ff6b6b" }}>
                            {fmt(t.amount)}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              <button
                style={{ ...S.btnPrimary, background: accent, opacity: (selectedCount > 0 && !allDups) ? 1 : 0.4 }}
                onClick={doImport}
                disabled={selectedCount === 0 || allDups}
              >
                ⬆ Importar {selectedCount} transação(ões) → {targetCard?.alias}
              </button>
            </>
          )}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    // CARD SETUP FORM
    // ════════════════════════════════════════════════════════════════
    function CardSetupForm({ onAdd }) {
      const isDark = useTheme();
      const S = getS(isDark);
      const [f, setF] = useState({ alias: "", number: "", limit: "", day: "", month: "", year: "" });
      const brand = detectBrand(f.number.replace(/\D/g, ""));
      const luhnOk = f.number.replace(/\D/g, "").length >= 13 ? luhn(f.number) : null;
      const accent = getAccent(brand);
      const canAdd = f.alias && f.limit && f.day && f.month && f.year &&
        parseInt(f.day) >= 1 && parseInt(f.day) <= 31 &&
        parseInt(f.month) >= 1 && parseInt(f.month) <= 12 &&
        parseInt(f.year) >= 2026;

      return (
        <div style={S.addCardBox}>
          <div style={S.grid2}>
            <div style={S.field}>
              <label style={S.label}>Apelido do cartão</label>
              <input style={S.input} placeholder="ex: Nubank, Inter, C6..." value={f.alias}
                onChange={e => setF(p => ({ ...p, alias: e.target.value }))} />
            </div>
            <div style={S.field}>
              <label style={S.label}>Valor da fatura (R$)</label>
              <input style={S.input} placeholder="ex: 8.000,00" value={f.limit}
                onChange={e => setF(p => ({ ...p, limit: e.target.value.replace(/[^0-9,]/g, "") }))}
                onBlur={() => {
                  const raw = parseFloat(f.limit.replace(/\./g, "").replace(",", "."));
                  if (!isNaN(raw)) setF(p => ({ ...p, limit: raw.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }));
                }} />
            </div>
          </div>
          <div style={S.field}>
            <label style={S.label}>4 primeiros dígitos do cartão (já identifica a bandeira)</label>
            <div style={{ position: "relative" }}>
              <input style={{ ...S.input, paddingRight: 70 }} placeholder="**** **** **** ****"
                value={f.number} onChange={e => setF(p => ({ ...p, number: maskCard(e.target.value) }))} />
              {brand && (
                <div style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", display: "flex", alignItems: "center" }}>
                  <BrandLogo brand={brand} size={28} />
                </div>
              )}
            </div>
            {brand && (
              <span style={{ ...S.hint, color: accent }}>
                ✓ {brand}{luhnOk === true ? " · Número válido (Luhn ✓)" : luhnOk === false ? " · Número inválido" : ""}
              </span>
            )}
          </div>
          <div style={S.field}>
            <label style={S.label}>Vencimento da fatura</label>
            <div style={{ display: "flex", gap: 8 }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <input style={{ ...S.input, width: 60, textAlign: "center",
                  borderColor: f.day && (parseInt(f.day) < 1 || parseInt(f.day) > 31) ? "#ef4444" : undefined }}
                  placeholder="Dia" maxLength={2} value={f.day}
                  onChange={e => setF(p => ({ ...p, day: e.target.value.replace(/\D/g, "") }))} />
                {f.day && (parseInt(f.day) < 1 || parseInt(f.day) > 31) && (
                  <span style={{ color: "#ef4444", fontSize: 11 }}>1–31</span>
                )}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <input style={{ ...S.input, width: 60, textAlign: "center",
                  borderColor: f.month && (parseInt(f.month) < 1 || parseInt(f.month) > 12) ? "#ef4444" : undefined }}
                  placeholder="Mês" maxLength={2} value={f.month}
                  onChange={e => setF(p => ({ ...p, month: e.target.value.replace(/\D/g, "") }))} />
                {f.month && (parseInt(f.month) < 1 || parseInt(f.month) > 12) && (
                  <span style={{ color: "#ef4444", fontSize: 11 }}>1–12</span>
                )}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <input style={{ ...S.input, width: 80, textAlign: "center",
                  borderColor: f.year && f.year.length === 4 && parseInt(f.year) < 2026 ? "#ef4444" : undefined }}
                  placeholder="Ano" maxLength={4} value={f.year}
                  onChange={e => setF(p => ({ ...p, year: e.target.value.replace(/\D/g, "") }))} />
                {f.year && f.year.length === 4 && parseInt(f.year) < 2026 && (
                  <span style={{ color: "#ef4444", fontSize: 11 }}>Mín. 2026</span>
                )}
              </div>
            </div>
            <span style={S.hint}>Dia / Mês / Ano — replicado para parcelas futuras</span>
          </div>
          <button style={{ ...S.btnPrimary, background: accent, opacity: canAdd ? 1 : 0.4 }}
            onClick={() => {
              if (!canAdd) return;
              onAdd({
                id: Date.now(), alias: f.alias, number: f.number, brand,
                limit: parseFloat(f.limit.replace(/\./g, "").replace(",", ".")),
                dueDate: new Date(parseInt(f.year), parseInt(f.month) - 1, parseInt(f.day)),
              });
              setF({ alias: "", number: "", limit: "", day: "", month: "", year: "" });
            }}
            disabled={!canAdd}>
            + Adicionar Cartão
          </button>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    // BALANCE STRIP
    // ════════════════════════════════════════════════════════════════
    function BalanceStrip({ card, spent }) {
      const isDark = useTheme();
      const S = getS(isDark);
      const pct = card.limit > 0 ? Math.min((spent / card.limit) * 100, 100) : 0;
      const remaining = card.limit - spent;
      const accent = getAccent(card.brand);
      const barColor = pct > 85 ? "#ff4d4d" : pct > 60 ? "#f5a623" : accent;
      return (
        <div style={{ ...S.strip, borderColor: accent + "44" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              {card.brand && <BrandLogo brand={card.brand} size={38} />}
              <div>
                <div style={{ color: isDark ? "#f1f5f9" : "#1e293b", fontWeight: 700, fontSize: 15 }}>{card.alias}</div>
                <div style={{ color: isDark ? "#64748b" : "#94a3b8", fontSize: 11, marginTop: 2 }}>Vence {fmtDate(card.dueDate)}</div>
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ color: isDark ? "#64748b" : "#94a3b8", fontSize: 10, textTransform: "uppercase", letterSpacing: 1 }}>Disponível</div>
              <div style={{ color: remaining < 0 ? "#ff4d4d" : accent, fontWeight: 700, fontSize: 20 }}>
                {fmt(remaining)}
              </div>
            </div>
          </div>
          <div style={S.barBg}>
            <div style={{ ...S.barFill, width: `${pct}%`, background: barColor }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ color: "#ff6b6b", fontSize: 12 }}>Lançado: {fmt(spent)}</span>
            <span style={{ color: "#8a96aa", fontSize: 12 }}>Fatura: {fmt(card.limit)}</span>
          </div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    // LAUNCH FORM
    // ════════════════════════════════════════════════════════════════
    function LaunchForm({ cards, onLaunch }) {
      const isDark = useTheme();
      const S = getS(isDark);
      const [f, setF] = useState({ cardId: cards[0]?.id ?? "", desc: "", value: "", installments: "1", category: null });
      const card = cards.find(c => c.id === f.cardId);
      const accent = getAccent(card?.brand);
      const inst = parseInt(f.installments) || 1;
      const val = parseMoney(f.value);
      const canLaunch = f.desc && val > 0 && card;

      return (
        <div style={S.formCard}>
          <h2 style={S.sectionTitle}>Novo Lançamento Manual</h2>
          <div style={S.field}>
            <label style={S.label}>Cartão</label>
            <select style={S.input} value={f.cardId}
              onChange={e => setF(p => ({ ...p, cardId: parseInt(e.target.value) }))}>
              {cards.map(c => <option key={c.id} value={c.id}>{c.alias}{c.brand ? ` · ${c.brand}` : ""}</option>)}
            </select>
          </div>
          <div style={S.grid2}>
            <div style={S.field}>
              <label style={S.label}>Descrição</label>
              <input style={S.input} placeholder="ex: Supermercado" value={f.desc}
                onChange={e => setF(p => ({ ...p, desc: e.target.value }))} />
            </div>
            <div style={S.field}>
              <label style={S.label}>Valor (R$)</label>
              <input style={S.input} placeholder="ex: 300,00" value={f.value}
                onChange={e => setF(p => ({ ...p, value: e.target.value }))} />
            </div>
          </div>
          <div style={S.field}>
            <label style={S.label}>Categoria</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <CategoryPicker value={f.category} onChange={cat => setF(p => ({ ...p, category: cat }))} />
              {f.category && <span style={{ ...S.hint, color: "#3b82f6", margin: 0 }}>{f.category.label}</span>}
            </div>
          </div>
          <div style={S.field}>
            <label style={S.label}>Parcelas</label>
            <select style={S.input} value={f.installments}
              onChange={e => setF(p => ({ ...p, installments: e.target.value }))}>
              {Array.from({ length: 12 }, (_, i) => i + 1).map(n => (
                <option key={n} value={n}>{n}x {val ? `(${fmt(val / n)} cada)` : ""}</option>
              ))}
            </select>
            {inst > 1 && val > 0 && (
              <span style={{ ...S.hint, color: accent }}>
                {inst}x de {fmt(val / inst)} — {inst - 1} parcela(s) nas faturas seguintes
              </span>
            )}
          </div>
          <button style={{ ...S.btnPrimary, background: accent, opacity: canLaunch ? 1 : 0.4 }}
            onClick={() => {
              if (!canLaunch) return;
              onLaunch({ card, desc: f.desc, value: val, installments: inst, category: f.category });
              setF(p => ({ ...p, desc: "", value: "", installments: "1", category: null }));
            }}
            disabled={!canLaunch}>
            + Lançar
          </button>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    // CARD SECTION
    // ════════════════════════════════════════════════════════════════
    function CardSection({ card, entries, onRemoveGroup }) {
      const isDark = useTheme();
      const S = getS(isDark);
      const [collapsed, setCollapsed] = useState(false);
      const accent = getAccent(card.brand);
      const current = entries.filter(e => e.cardId === card.id && e.month === 0);
      const future = entries.filter(e => e.cardId === card.id && e.month > 0);
      const spent = current.reduce((s, e) => s + e.value, 0);
      const ofxCount = current.filter(e => e.fromOFX).length;

      const futureByMonth = useMemo(() => {
        const g = {};
        future.forEach(e => {
          if (!g[e.month]) g[e.month] = { month: e.month, dueDate: e.dueDate, items: [] };
          g[e.month].items.push(e);
        });
        return Object.values(g).sort((a, b) => a.month - b.month);
      }, [future]);

      return (
        <div style={{ ...S.cardSection, borderColor: accent + "33" }}>
          <BalanceStrip card={card} spent={spent} />

          <button style={{ ...S.collapseBtn, color: accent }}
            onClick={() => setCollapsed(c => !c)}>
            {collapsed ? "▸ Ver lançamentos" : "▾ Ocultar lançamentos"}
            {ofxCount > 0 && !collapsed && (
              <span style={{ ...S.instBadge, marginLeft: 8, background: accent + "22", color: accent }}>
                {ofxCount} via OFX
              </span>
            )}
          </button>

          {!collapsed && (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <div style={{ ...S.subLabel, color: accent, marginBottom: 6 }}>
                  Fatura Atual · {current.length} item(s)
                </div>
                {current.length === 0 ? (
                  <div style={S.emptySmall}>Nenhum lançamento nesta fatura ainda.</div>
                ) : (
                  <>
                    <table style={S.table}>
                      <thead>
                        <tr>{["", "Descrição", "Parcela", "Categoria", "Valor", ""].map((h, i) =>
                          <th key={i} style={S.th}>{h}</th>)}</tr>
                      </thead>
                      <tbody>
                        {current.map(e => (
                          <tr key={e.id} style={S.tr}>
                            <td style={{ ...S.td, width: 20 }}>
                              {e.fromOFX && (
                                <span title="Importado via OFX" style={{ color: accent, fontSize: 10 }}>⬆</span>
                              )}
                            </td>
                            <td style={S.td}>
                              {e.desc}
                              {e.ofxDate && (
                                <span style={{ color: isDark ? "#64748b" : "#94a3b8", fontSize: 10, marginLeft: 6 }}>
                                  {fmtDateShort(e.ofxDate)}
                                </span>
                              )}
                            </td>
                            <td style={S.td}>
                              {e.installment
                                ? <span style={S.instBadge}>{e.installment}</span>
                                : <span style={{ color: isDark ? "#64748b" : "#94a3b8" }}>à vista</span>}
                            </td>
                            <td style={S.td}>
                              {e.categoryLabel
                                ? <span style={{ fontSize: 11, background: isDark ? "#1e3a5f" : "#dbeafe", color: "#3b82f6", borderRadius: 4, padding: "2px 7px", whiteSpace: "nowrap" }}>
                                    {e.categoryLabel.split(" › ").pop()}
                                  </span>
                                : <span style={{ color: isDark ? "#475569" : "#cbd5e1", fontSize: 11 }}>—</span>}
                            </td>
                            <td style={{ ...S.td, color: "#ff6b6b", fontWeight: 600 }}>{fmt(e.value)}</td>
                            <td style={S.td}>
                              <button style={S.btnRemove} title="Remover todas as parcelas"
                                onClick={() => onRemoveGroup(e.groupId)}>✕</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    <div style={{ textAlign: "right", color: "#ff6b6b", fontWeight: 700, fontSize: 13, marginTop: 8 }}>
                      Subtotal: {fmt(spent)}
                    </div>
                  </>
                )}
              </div>

              {futureByMonth.length > 0 && (
                <div>
                  <div style={{ ...S.subLabel, color: isDark ? "#64748b" : "#94a3b8", marginBottom: 6 }}>Parcelas Futuras</div>
                  {futureByMonth.map(group => (
                    <div key={group.month} style={S.futureGroup}>
                      <div style={S.futureGroupHeader}>
                        <span style={{ color: accent, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>
                          {group.dueDate ? fmtDate(group.dueDate) : `+${group.month} mês`}
                        </span>
                        <span style={{ color: isDark ? "#f1f5f9" : "#1e293b", fontSize: 13, fontWeight: 700 }}>
                          {fmt(group.items.reduce((s, e) => s + e.value, 0))}
                        </span>
                      </div>
                      {group.items.map(e => (
                        <div key={e.id} style={S.futureItem}>
                          {e.fromOFX && <span style={{ color: accent, fontSize: 9 }} title="Via OFX">⬆</span>}
                          <span>{e.desc}</span>
                          <span style={S.instBadge}>{e.installment}</span>
                          <span style={{ marginLeft: "auto", color: isDark ? "#94a3b8" : "#64748b" }}>{fmt(e.value)}</span>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    // APP  (renomeado de App → CartaoFaturas para evitar conflito)
    // ════════════════════════════════════════════════════════════════
    function CartaoFaturas() {
      const isDark = useTheme();
      const S = getS(isDark);
      const [step, setStep] = useState("setup");
      const [cards, setCards] = useState([]);
      const [entries, setEntries] = useState([]);
      const [showAddCard, setShowAddCard] = useState(false);
      const [showOFX, setShowOFX] = useState(false);
      const [importedFitids, setImportedFitids] = useState(new Set());

      async function handleLaunch({ card, desc, value, installments, category }) {
        const groupId = Date.now();
        const perInstall = value / installments;
        const newEntries = Array.from({ length: installments }, (_, i) => ({
          id: groupId + i, groupId, cardId: card.id,
          desc, value: perInstall, total: value,
          installment: installments > 1 ? `${i + 1}/${installments}` : null,
          month: i, dueDate: addMonths(card.dueDate, i),
          classeId: category?.classeId || null, categoryLabel: category?.label || null, cardAlias: card.alias,
        }));
        setEntries(prev => [...prev, ...newEntries]);
        await saveCartaoEntriesToSupabase(newEntries);
      }

      async function handleOFXImport(newEntries, fitids) {
        setEntries(prev => [...prev, ...newEntries]);
        setImportedFitids(prev => new Set([...prev, ...fitids]));
        await saveCartaoEntriesToSupabase(newEntries);
      }

      // ── SETUP
      if (step === "setup") return (
        <div style={S.root}>
          <div style={S.setupWrapper}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 38 }}>💳</div>
              <h1 style={S.setupTitle}>Controle de Faturas</h1>
              <p style={S.setupSub}>Adicione seus cartões. Cada um terá seu próprio controle de limite e parcelas.</p>
            </div>

            {cards.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {cards.map(c => (
                  <div key={c.id} style={{ ...S.addedCardChip, borderColor: getAccent(c.brand) + "44" }}>
                    {c.brand && <BrandLogo brand={c.brand} size={30} />}
                    <span style={{ color: isDark ? "#f1f5f9" : "#1e293b", fontSize: 13, fontWeight: 600 }}>{c.alias}</span>
                    <span style={{ color: isDark ? "#94a3b8" : "#64748b", fontSize: 12 }}>{fmt(c.limit)}</span>
                    <span style={{ color: isDark ? "#64748b" : "#94a3b8", fontSize: 11 }}>· vence {fmtDate(c.dueDate)}</span>
                    <button style={{ ...S.btnRemove, marginLeft: "auto" }}
                      onClick={() => setCards(p => p.filter(x => x.id !== c.id))}>✕</button>
                  </div>
                ))}
              </div>
            )}

            <CardSetupForm onAdd={c => setCards(p => [...p, c])} />

            {cards.length > 0 && (
              <button style={S.btnPrimary} onClick={() => setStep("main")}>
                Ir para Lançamentos →
              </button>
            )}
          </div>
        </div>
      );

      // ── MAIN
      return (
        <div style={S.root}>
          <div style={S.container}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingBottom: 4 }}>
              <h1 style={{ color: isDark ? "#f1f5f9" : "#1e293b", fontSize: 20, fontWeight: 700, margin: 0, letterSpacing: 1 }}>
                💳 Controle de Faturas
              </h1>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={{ ...S.btnSecondary, color: "#00e5a0", borderColor: "#00e5a033" }}
                  onClick={() => { setShowOFX(p => !p); setShowAddCard(false); }}>
                  {showOFX ? "✕" : "⬆ OFX"}
                </button>
                <button style={S.btnSecondary} onClick={() => { setShowAddCard(p => !p); setShowOFX(false); }}>
                  {showAddCard ? "✕" : "+ Cartão"}
                </button>
                <button style={S.btnSecondary} onClick={() => { setStep("setup"); setCards([]); setEntries([]); setImportedFitids(new Set()); }}>
                  Reiniciar
                </button>
              </div>
            </div>

            {showOFX && (
              <OFXImporter cards={cards} onImport={handleOFXImport} onClose={() => setShowOFX(false)} importedFitids={importedFitids} />
            )}

            {showAddCard && (
              <div style={S.formCard}>
                <h2 style={S.sectionTitle}>Novo Cartão</h2>
                <CardSetupForm onAdd={c => { setCards(p => [...p, c]); setShowAddCard(false); }} />
              </div>
            )}

            <LaunchForm cards={cards} onLaunch={handleLaunch} />

            {cards.map(card => (
              <CardSection key={card.id} card={card} entries={entries}
              onRemoveGroup={gid => {
                const removed = entries.filter(e => e.groupId === gid && e.fromOFX);
                if (removed.length > 0) {
                  const removedFitids = new Set(removed.map(e => e.ofxFitid).filter(Boolean));
                  setImportedFitids(prev => {
                    const next = new Set(prev);
                    removedFitids.forEach(f => next.delete(f));
                    return next;
                  });
                }
                setEntries(p => p.filter(e => e.groupId !== gid));
              }} />
            ))}
          </div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    // STYLES
    // ════════════════════════════════════════════════════════════════
    function getS(isDark) {
      const bg      = isDark ? "#0f172a" : "#f1f5f9";
      const surface = isDark ? "#1e293b" : "#ffffff";
      const surf2   = isDark ? "#273549" : "#f8fafc";
      const border  = isDark ? "#334155" : "#e2e8f0";
      const text    = isDark ? "#f1f5f9" : "#1e293b";
      const text2   = isDark ? "#94a3b8" : "#64748b";
      const text3   = isDark ? "#64748b" : "#94a3b8";
      return {
        root: { minHeight: "100vh", background: bg, fontFamily: "'Poppins', sans-serif", fontSize: 15, display: "flex", justifyContent: "center", padding: "28px 16px" },
        container: { width: "100%", maxWidth: 720, display: "flex", flexDirection: "column", gap: 14 },
        setupWrapper: { width: "100%", maxWidth: 520, margin: "0 auto", display: "flex", flexDirection: "column", gap: 16 },
        setupTitle: { color: text, fontSize: 26, fontWeight: 700, margin: "8px 0 0", letterSpacing: 1 },
        setupSub: { color: text2, fontSize: 15, margin: "6px 0 0" },
        addedCardChip: { background: surface, border: "1px solid", borderRadius: 10, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10 },
        addCardBox: { background: surface, border: `1px solid ${border}`, borderRadius: 12, padding: 20, display: "flex", flexDirection: "column", gap: 14 },
        importerCard: { background: surf2, border: `1px solid ${border}`, borderRadius: 14, padding: 20, display: "flex", flexDirection: "column", gap: 14 },
        formCard: { background: surface, border: `1px solid ${border}`, borderRadius: 14, padding: 20, display: "flex", flexDirection: "column", gap: 14 },
        cardSection: { background: surf2, border: "1px solid", borderRadius: 14, padding: 20, display: "flex", flexDirection: "column", gap: 12 },
        strip: { background: surface, borderRadius: 10, padding: 16, display: "flex", flexDirection: "column", gap: 10, border: "1px solid" },
        barBg: { background: border, borderRadius: 99, height: 7, overflow: "hidden" },
        barFill: { height: "100%", borderRadius: 99, transition: "width 0.4s ease" },
        dropZone: { border: "1.5px dashed", borderRadius: 10, padding: "32px 20px", textAlign: "center", cursor: "pointer", transition: "all 0.2s" },
        metaBox: { display: "flex", flexWrap: "wrap", gap: 6 },
        metaChip: { background: bg, border: `1px solid ${border}`, borderRadius: 99, padding: "4px 12px", fontSize: 13, color: text2 },
        errorBox: { background: "#fee2e2", border: "1px solid #fecaca", borderRadius: 8, padding: "10px 14px", color: "#ef4444", fontSize: 14 },
        grid2: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 },
        field: { display: "flex", flexDirection: "column", gap: 6 },
        label: { color: text2, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, fontWeight: 600 },
        input: { background: surf2, border: `1px solid ${border}`, borderRadius: 8, padding: "11px 14px", color: text, fontSize: 15, fontFamily: "'Poppins', sans-serif", outline: "none", width: "100%", boxSizing: "border-box" },
        hint: { fontSize: 13, color: text3, marginTop: 2 },
        btnPrimary: { background: "linear-gradient(135deg,#22c55e,#16a34a)", color: "#fff", border: "none", borderRadius: 8, padding: "13px 24px", fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "'Poppins', sans-serif", letterSpacing: 0.5, width: "100%", transition: "opacity 0.2s" },
        btnSecondary: { background: surface, color: text2, border: `1px solid ${border}`, borderRadius: 8, padding: "9px 16px", fontSize: 13, cursor: "pointer", fontFamily: "'Poppins', sans-serif", letterSpacing: 0.5 },
        btnRemove: { background: "transparent", border: "none", color: text3, cursor: "pointer", fontSize: 13, padding: 4 },
        collapseBtn: { background: "transparent", border: "none", fontSize: 13, cursor: "pointer", fontFamily: "'Poppins', sans-serif", letterSpacing: 0.5, padding: 0, textAlign: "left", display: "flex", alignItems: "center" },
        sectionTitle: { color: text3, fontSize: 13, textTransform: "uppercase", letterSpacing: 2, margin: 0, display: "flex", alignItems: "center", gap: 8 },
        subLabel: { fontSize: 12, textTransform: "uppercase", letterSpacing: 1.5, fontWeight: 700 },
        table: { width: "100%", borderCollapse: "collapse", marginTop: 4 },
        th: { color: text3, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, padding: "8px 10px", borderBottom: `1px solid ${border}`, textAlign: "left" },
        tr: { borderBottom: `1px solid ${bg}` },
        td: { color: text, fontSize: 14, padding: "10px 10px" },
        instBadge: { background: surf2, color: "#3b82f6", borderRadius: 4, padding: "3px 9px", fontSize: 12, fontWeight: 600 },
        futureGroup: { background: surf2, borderRadius: 8, padding: "12px 14px", display: "flex", flexDirection: "column", gap: 5, border: `1px solid ${border}`, marginBottom: 6 },
        futureGroupHeader: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 2 },
        futureItem: { display: "flex", gap: 8, alignItems: "center", fontSize: 14, color: text2 },
        emptySmall: { color: text3, fontSize: 14, padding: "8px 0" },
      };
    }

    // Montar o app no ponto de montagem
    ReactDOM.createRoot(document.getElementById('cartao-root')).render(<CartaoFaturas />);
  </script>
  <footer class="sf-footer">Sistema Financeiro © 2026 — Carlos Caxito &nbsp;|  Dados demonstrativos</footer>
  <script>function sfToggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('sfThemeBtn').textContent=d?'🌙 Escuro':'☀️ Claro'}</script>
</body>
</html>
