<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Senha — Sistema Financeiro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f1f5f9;--surface:#fff;--surface2:#f8fafc;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.06);--radius-sm:10px;--transition:.22s cubic-bezier(.4,0,.2,1)}
    [data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--surface2:#273549;--border:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b}
    body{font-family:'Poppins',sans-serif!important;background:var(--bg)!important;color:var(--text)!important}
    [data-theme="dark"] .card{background:var(--surface)!important;border-color:var(--border)!important;color:var(--text)!important}
    [data-theme="dark"] input{background:var(--surface2)!important;color:var(--text)!important;border-color:var(--border)!important}
    [data-theme="dark"] label,[data-theme="dark"] h1,[data-theme="dark"] h2,[data-theme="dark"] h3{color:var(--text)!important}
    [data-theme="dark"] .auth-card{background:var(--surface)!important;color:var(--text)!important}
    .sf-header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between}
    .sf-brand{font-weight:700;font-size:1.15rem;color:var(--text);display:flex;align-items:center;gap:.5rem;text-decoration:none}
    .sf-brand span{color:#22c55e}
    .sf-hr{display:flex;align-items:center;gap:.75rem}
    .sf-theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.35rem .75rem;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition);font-family:inherit}
    .sf-theme-btn:hover{background:var(--border)}
    .sf-nav{position:sticky;top:60px;z-index:99;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:.1rem;height:42px;overflow-x:auto}
    .sf-nav::-webkit-scrollbar{height:0}
    .sf-nav a{display:inline-flex;align-items:center;gap:.3rem;padding:.28rem .65rem;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;color:var(--text2);text-decoration:none;white-space:nowrap;transition:all var(--transition);flex-shrink:0}
    .sf-nav a:hover{background:var(--surface2);color:var(--text)}
    .sf-nav a.active{background:#f0fdf4;color:#16a34a}
    [data-theme="dark"] .sf-nav a.active{background:rgba(34,197,94,.15);color:#4ade80}
    .sf-footer{text-align:center;padding:1.5rem;font-size:.72rem;color:var(--text3);border-top:1px solid var(--border);margin-top:1rem}

    /* strength bar */
    .strength-bar{height:5px;border-radius:99px;background:var(--border);margin-top:.4rem;overflow:hidden}
    .strength-fill{height:100%;border-radius:99px;width:0;transition:width .3s,background .3s}
    .strength-label{font-size:.72rem;color:var(--text3);margin-top:.25rem}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="sf-header">
    <a href="portal.html" class="sf-brand">💰 <span>Sistema</span> Financeiro</a>
    <div class="sf-hr">
      <button class="sf-theme-btn" onclick="sfToggleTheme()" id="sfThemeBtn">🌙 Escuro</button>
    </div>
  </header>
  <nav class="sf-nav">
    <a href="portal.html">🏠 Portal</a>
    <a href="login.html">🔐 Login</a>
    <a href="nova-senha.html" class="active">🔑 Nova Senha</a>
  </nav>

  <div class="auth-container">
    <div class="card auth-card">
      <div class="card-header text-center">
        <h1 class="card-title">🔑 Redefinir Senha</h1>
        <p class="card-description">Digite e confirme sua nova senha</p>
      </div>

      <!-- Estado: aguardando token (mostrado até o JS confirmar o token) -->
      <div id="waitingToken" style="text-align:center;padding:1.5rem 0;">
        <div style="font-size:2rem;margin-bottom:.5rem;">⏳</div>
        <p style="color:var(--text2);font-size:.9rem;">Verificando link de recuperação...</p>
      </div>

      <!-- Estado: token inválido/expirado -->
      <div id="invalidToken" style="display:none;text-align:center;padding:1rem 0;">
        <div style="font-size:2rem;margin-bottom:.5rem;">❌</div>
        <p style="color:#ef4444;font-weight:600;margin-bottom:.5rem;">Link inválido ou expirado</p>
        <p style="color:var(--text2);font-size:.85rem;margin-bottom:1.5rem;">Solicite um novo link de recuperação de senha.</p>
        <a href="login.html" class="btn btn-primary" style="display:inline-block;text-decoration:none;">Voltar ao Login</a>
      </div>

      <!-- Formulário principal (oculto até ter token válido) -->
      <div id="formSection" style="display:none;">
        <div id="errorMessage" class="alert alert-error hidden"></div>
        <div id="successMessage" class="alert alert-success hidden"></div>

        <form id="newPassForm">
          <div class="form-group">
            <label for="newPassword">Nova Senha</label>
            <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="checkStrength(this.value)">
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-label" id="strengthLabel"></div>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmar Senha</label>
            <input type="password" id="confirmPassword" placeholder="Repita a nova senha" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem;" id="submitBtn">
            <span id="btnText">✅ Salvar Nova Senha</span>
            <span id="btnLoading" class="loading hidden"></span>
          </button>
        </form>
        <div class="text-center mt-2">
          <a href="login.html" style="font-size:.82rem;color:var(--text3);">← Voltar ao Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="config/supabase-config.js"></script>
  <script>
    // Força o Supabase a processar o fragment hash (#access_token=...) da URL
    window.addEventListener('DOMContentLoaded', async () => {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.replace('#', '?').replace('#', '&'));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const type = params.get('type');

      if (accessToken && type === 'recovery') {
        try {
          const client = createSupabaseClient();
          const { error } = await client.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || '',
          });
          if (error) throw error;
          document.getElementById('waitingToken').style.display = 'none';
          document.getElementById('formSection').style.display = 'block';
        } catch (e) {
          document.getElementById('waitingToken').style.display = 'none';
          document.getElementById('invalidToken').style.display = 'block';
        }
      } else {
        // Sem token — mostrar mensagem de link inválido
        document.getElementById('waitingToken').style.display = 'none';
        document.getElementById('invalidToken').style.display = 'block';
      }
    });

    function checkStrength(v) {
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (v.length >= 6) score++;
      if (v.length >= 10) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const pct = (score / 5) * 100;
      const colors = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
      const labels = ['Muito fraca','Fraca','Média','Forte','Muito forte'];
      fill.style.width = pct + '%';
      fill.style.background = colors[score - 1] || '#e2e8f0';
      label.textContent = score > 0 ? labels[score - 1] : '';
    }

    document.getElementById('newPassForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('errorMessage');
      const okEl = document.getElementById('successMessage');
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnLoading = document.getElementById('btnLoading');

      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      if (newPass.length < 6) {
        errEl.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        errEl.classList.remove('hidden'); return;
      }
      if (newPass !== confirm) {
        errEl.textContent = 'As senhas não coincidem.';
        errEl.classList.remove('hidden'); return;
      }

      btn.disabled = true; btnText.classList.add('hidden'); btnLoading.classList.remove('hidden');
      try {
        await updatePassword(newPass);
        okEl.textContent = '✅ Senha alterada com sucesso! Redirecionando...';
        okEl.classList.remove('hidden');
        setTimeout(() => { window.location.href = 'portal.html'; }, 2000);
      } catch (err) {
        errEl.textContent = err.message || 'Erro ao alterar senha.';
        errEl.classList.remove('hidden');
        btn.disabled = false; btnText.classList.remove('hidden'); btnLoading.classList.add('hidden');
      }
    });
  </script>
  <footer class="sf-footer">Sistema Financeiro © 2026 — Carlos Caxito</footer>
  <script>function sfToggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('sfThemeBtn').textContent=d?'🌙 Escuro':'☀️ Claro'}</script>
</body>
</html>
